# =====================================================================
# DESCARTADOS: documentados para no re-añadirlos sin motivo.
# =====================================================================
descartados:
  - nombre: Create
    motivo: Sin versión Fabric para 1.21.1 (oficialmente NeoForge). Port no oficial abandonado/retirado.
  - nombre: Modern Industrialization
    motivo: Desde 1.20.4 es exclusivo de NeoForge; en Fabric se quedó en 1.20.1. Sustituido por Tech Reborn.
  - nombre: Industrial Revolution
    motivo: Sin soporte 1.21.1 confirmado; Tech Reborn sí lo tiene y cubre el hueco tecnológico.
  - nombre: Mekanism / Refined Storage / AE2 / Powah / Pipez
    motivo: "Exclusivos de Forge/NeoForge. Sin equivalente directo: se cubre con Tech Reborn + Expanded Storage."
  - nombre: Iron's Spells 'n Spellbooks
    motivo: "Exclusivo de Forge/NeoForge. Alternativa Fabric: Wizards (RPG Series)."
  - nombre: Ars Nouveau
    motivo: "Exclusivo de Forge/NeoForge. Alternativa Fabric: Wizards (RPG Series)."
  - nombre: Botania
    motivo: Pesado para el presupuesto de RAM y su soporte Fabric es dudoso; solapa con Wizards.
  - nombre: Biomes O' Plenty / Oh The Biomes We've Gone
    motivo: Sin Fabric 1.21.1 fiable (BYG es NeoForge). Terralith cubre mejor el hueco.
  - nombre: Epic Fight
    motivo: "Exclusivo de Forge/NeoForge. Alternativa Fabric: Better Combat + Combat Roll."
  - nombre: Jade
    motivo: En 1.21.1 el visor/info es de Forge/NeoForge; en Fabric se usa WTHIT.
  - nombre: REI (Roughly Enough Items)
    motivo: Duplica a EMI siendo más pesado (necesita Architectury). Se eligió EMI.
  - nombre: JourneyMap
    motivo: Mucho más pesado en RAM/dis co que Xaero's Minimap para el mismo uso.
  - nombre: Storage Drawers / Sophisticated Storage / Tom's Simple Storage
    motivo: De Forge/NeoForge o sin port fiable. Se cubre con Expanded Storage + Tech Reborn.
  - nombre: Functional Storage
    motivo: El oficial no tiene Fabric 1.21.1; el port no oficial es diminuto y arriesgado.
  - nombre: FramedBlocks
    motivo: Exclusivo de Forge/NeoForge. La construcción se cubre con Supplementaries + Another Furniture.
  - nombre: Explorer's Compass
    motivo: Duplica parcialmente a Nature's Compass (biomas vs estructuras); se prioriza biomas por Terralith.
  - nombre: When Dungeons Arise / Born in Chaos
    motivo: Packs de estructuras pesados; YUNG's + Structory + Towns and Towers cubren el hueco siendo ligeros.
  - nombre: Guard Villagers
    motivo: Sin build 1.21.1/Fabric confirmada. Se re-evaluará si aparece versión estable.
  - nombre: C2ME
    motivo: Paraleliza chunks pero es famoso por inestabilidad con mods de worldgen. Riesgo inaceptable.
  - nombre: ModernFix
    motivo: Riesgo de conflictos; FerriteCore + Lithium + Krypton cubren la optimización sin tocar lógica delicada.
  - nombre: VMP (Very Many Players)
    motivo: Pensado for cientos de jugadores; overkill para un servidor de amigos.
  - nombre: Architectury API (en core)
    motivo: Ningún mod del core la requiere (solo el opcional Chipped). No se añade peso muerto.
  - nombre: Litematica (en core)
    motivo: Útil pero solo para constructores; queda como opcional de cliente (requiere Malilib).
  - nombre: Shaders incluidos por defecto
    motivo: Con 3 GB de cliente no son viables de serie; Iris queda opcional para quien pueda.
  - nombre: Essential Mod
    motivo: Servicio externo cerrado, no encaja con servidor auto-alojado. El multijugador se cubre con SVC + Waystones.
  - nombre: Enchanting Infuser
    motivo: Pide 2 librerías extra no listadas (Puzzles Lib + Forge Config API Port) para un lujo menor; basta el encantamiento vanilla.
  - nombre: GeckoLib
    motivo: "Verificado en Modrinth: ningún mod del pack la requiere (el stack RPG usa Armor Model API; Naturalist 2.x la eliminó)."
  - nombre: AzureLib Armor
    motivo: El stack RPG 3.x usa Armor Model API; nada referencia a AzureLib Armor en sus dependencias.
  - nombre: Reap (slug 'reap')
    motivo: El slug es otro mod distinto (solo MC 26.2). Sustituido por Simple Harvest (5 KB, solo servidor).
  - nombre: Badges Lib (slug 'badges-lib')
    motivo: El slug no existe (404); WTHIT requiere Bad Packets ('badpackets'). Slug corregido.
  - nombre: DeathLog
    motivo: El slug 'deathlog' no tiene build 1.21.1 y la alternativa es diminuta; las tumbas las cubre Universal Graves.
  - nombre: Expanded Storage
    motivo: "Proyecto archivado/abandonado por su autor; decisión del usuario no depender de él. Almacén: Tech Reborn (Quantum) + vanilla."
  - nombre: Corpse
    motivo: Sin versión Fabric (loaders forge+neoforge). Sustituido por Universal Graves + Polymer (100% servidor, coste 0 en cliente).
  - nombre: Villager Names
    motivo: Sin build 1.21.1 (llega solo a 1.21, abandonado en 2024). Capricho menor; no compensa estirar versiones.
  - nombre: Nature's Compass (slug 'nature-s-compass')
    motivo: Slug inexistente (404); el correcto es 'natures-compass'. Slug corregido.
  - nombre: EMI Trades
    motivo: Sin build 1.21.1 (llega a 1.20.4); el slug 'emi-trades' no existe en Modrinth. Fork Reborn sin verificar (ver opcionales).
