# =====================================================================
# Manifiesto del modpack — ÚNICA FUENTE DE VERDAD
# Minecraft 1.21.1 + Fabric. Supervivencia multijugador estilo Karmaland.
# ---------------------------------------------------------------------
# estado_global: propuesto | aprobado
#   - "propuesto":  solo se valida y verifica. PROHIBIDO descargar .jar.
#   - "aprobado":   resolver.py puede fijar versiones y construir.py descargar.
# lado: cliente | servidor | ambos
# impacto (RAM/rendimiento aprox.): despreciable | bajo | moderado | alto | mejora
#   - "mejora": el mod REDUCE consumo o SUBE el rendimiento (optimización).
# verificacion: confirmada | estandar | pendiente
#   - confirmada: verificado en Modrinth durante la propuesta (ver docs/PROPUESTA_MODS.md).
#   - estandar:   mod ubicuo en packs 1.21.1/Fabric; lo re-verifica resolver.py.
#   - pendiente:  resolver.py debe confirmar slug/existencia antes de incluir.
# =====================================================================
minecraft: "1.21.1"
loader: "fabric"
modpack_nombre: "Karmaland"
modpack_version: "1.0.0"
estado_global: propuesto

