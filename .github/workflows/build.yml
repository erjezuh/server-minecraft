name: Build Minecraft Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanity check
        run: |
          echo "GitHub Actions build workflow is valid."
          echo "Commit: $GITHUB_SHA"
          test -f modpack/mods.txt
          test -f modpack/modpack.yml
