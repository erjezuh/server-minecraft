name: Build Minecraft Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project structure
        run: |
          echo "Minecraft server project"
          find . -maxdepth 3 -type f | sort

      - name: Prepare server package
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/server
          cp -r server/. build/server/ 2>/dev/null || true

      - name: Build exact client modpack
        run: bash .github/scripts/build-client.sh

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-server
          path: build/server
          retention-days: 30

      - name: Upload client ZIP
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-client-1.21.1-fabric
          path: build/minecraft-client-1.21.1-fabric.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload client manifest
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-client-manifest
          path: |
            modpack/modpack.yml
            modpack/mods.txt
          retention-days: 30
