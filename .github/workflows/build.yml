name: Build Minecraft Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project structure
        run: |
          echo "Minecraft server project"
          find . -maxdepth 3 -type f | sort

      - name: Prepare server package
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/server
          cp -r server/. build/server/ 2>/dev/null || true

      - name: Build exact client modpack
        env:
          MC_VERSION: "1.21.1"
          LOADER: "fabric"
          LOADER_VERSION: "0.19.5"
        run: |
          set -euo pipefail
          command -v jq >/dev/null
          command -v curl >/dev/null
          command -v zip >/dev/null

          rm -rf build/client
          mkdir -p build/client/mods
          declare -A SEEN_PROJECTS=()

          # Map IDs from the server log to their public Modrinth project slugs.
          modrinth_slug() {
            case "$1" in
              worldweaver) echo "world-weaver" ;;
              common-storage-library) echo "common-storage" ;;
              *) echo "$1" ;;
            esac
          }

          resolve_mod() {
            local slug="$(modrinth_slug "$1")"
            local wanted_version="$2"
            if [[ -n "${SEEN_PROJECTS[$slug]:-}" ]]; then return 0; fi
            SEEN_PROJECTS[$slug]=1

            echo "Resolving $slug @ $wanted_version"
            local versions_json
            versions_json="$(curl -fsSL --retry 3 "https://api.modrinth.com/v2/project/$slug/version?game_versions=%5B%22$MC_VERSION%22%5D&loaders=%5B%22$LOADER%22%5D")"
            local version_id
            version_id="$(jq -r --arg v "$wanted_version" '[.[] | select(.version_number == $v)][0].id // empty' <<<"$versions_json")"

            if [[ -z "$version_id" ]]; then
              echo "::error::Could not resolve exact Modrinth version: $slug @ $wanted_version"
              jq -r '.[0:10][] | "  " + .version_number + " (" + .id + ")"' <<<"$versions_json" || true
              return 1
            fi

            local version_json
            version_json="$(curl -fsSL --retry 3 "https://api.modrinth.com/v2/version/$version_id")"
            local primary
            primary="$(jq -r '[.files[] | select(.primary == true)][0].url // .files[0].url // empty' <<<"$version_json")"
            local filename
            filename="$(jq -r '[.files[] | select(.primary == true)][0].filename // .files[0].filename // empty' <<<"$version_json")"

            if [[ -z "$primary" || -z "$filename" ]]; then
              echo "::error::No downloadable file for $slug @ $wanted_version"
              return 1
            fi

            echo "  -> $filename"
            curl -fL --retry 3 "$primary" -o "build/client/mods/$filename"

            while IFS="$(printf '\\t')" read -r dep_project dep_version dep_type; do
              [[ -z "$dep_project" || "$dep_type" != "required" ]] && continue
              if [[ -n "$dep_version" && "$dep_version" != "null" ]]; then
                local dep_slug
                dep_slug="$(curl -fsSL --retry 3 "https://api.modrinth.com/v2/project/$dep_project" | jq -r '.slug')"
                local dep_ver
                dep_ver="$(curl -fsSL --retry 3 "https://api.modrinth.com/v2/version/$dep_version" | jq -r '.version_number')"
                resolve_mod "$dep_slug" "$dep_ver"
              fi
            done < <(jq -r '.dependencies[]? | [.project_id // "", .version_id // "", .dependency_type // ""] | @tsv' <<<"$version_json")
          }

          while IFS='|' read -r slug version; do
            [[ -z "$slug" || "$slug" == \#* ]] && continue
            resolve_mod "$slug" "$version"
          done < modpack/mods.txt

          find build/client/mods -type f -iname 'voicechat-*.jar' -delete
          count="$(find build/client/mods -maxdepth 1 -type f -name '*.jar' | wc -l)"
          echo "Client JAR count: $count"
          test "$count" -gt 0

          cat > build/client/README.txt <<EOF
Minecraft 1.21.1 Fabric ${LOADER_VERSION}
Generated automatically by GitHub Actions.
The requested mod versions are pinned to the versions recorded from the server.
Voice Chat is intentionally excluded.
EOF

          cp modpack/modpack.yml build/client/modpack.yml
          cd build/client
          zip -qr ../minecraft-client-1.21.1-fabric.zip .
          cd ../..
          ls -lh build/minecraft-client-1.21.1-fabric.zip

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-server
          path: build/server
          retention-days: 30

      - name: Upload client ZIP
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-client-1.21.1-fabric
          path: build/minecraft-client-1.21.1-fabric.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload client manifest
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-client-manifest
          path: |
            modpack/modpack.yml
            modpack/mods.txt
          retention-days: 30
