name: Deploy server via SFTP

on:
  workflow_run:
    workflows: ["Build Minecraft Server"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "GitHub Actions run ID containing the approved modpack-1.0.0 artifact"
        required: true
        type: string
      confirm:
        description: "Type DEPLOY to authorize the upload"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
          || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Select build run
        id: build
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "run_id=$WORKFLOW_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=$DISPATCH_RUN_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate required deployment secrets
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          for name in SFTP_HOST SFTP_PORT SFTP_USER SFTP_PASSWORD SFTP_REMOTE_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Secret: $name"
              exit 1
            fi
          done

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: minecraft-server
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.build.outputs.run_id }}

      - name: Validate server package
        run: |
          set -euo pipefail
          test -f artifact/servidor.zip
          test -s artifact/servidor.zip
          unzip -t artifact/servidor.zip >/dev/null
          echo "servidor.zip is valid."

      - name: Extract server package
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy
          unzip -q artifact/build/servidor.zip -d deploy
          test -n "$(find deploy -type f -print -quit)"

      - name: Install OpenSSH password helper
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Remove obsolete Voice Chat mod
        run: |
          set -euo pipefail
          find deploy -type f -iname 'voicechat-*.jar' -print -delete || true

      - name: Upload server files via OpenSSH SFTP
        env:
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          cd deploy
          sshpass -e sftp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -P "$SFTP_PORT" \
            "$SFTP_USER@$SFTP_HOST" <<EOF
          cd "$SFTP_REMOTE_PATH"
          rm mods/voicechat-*.jar
          put -r *
          EOF
          echo "SFTP upload completed successfully."

      - name: Deployment summary
        run: |
          echo "SFTP upload completed successfully."
