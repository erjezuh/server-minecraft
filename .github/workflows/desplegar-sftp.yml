name: Deploy server via SFTP

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "GitHub Actions run ID containing the approved modpack-1.0.0 artifact"
        required: true
        type: string
      confirm:
        description: "Type DEPLOY to authorize the upload"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate required deployment secrets
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          for name in SFTP_HOST SFTP_PORT SFTP_USER SFTP_PASSWORD SFTP_REMOTE_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Secret: $name"
              exit 1
            fi
          done
          echo "All required SFTP secrets are present."

      - name: Download approved build artifact
        uses: actions/download-artifact@v4
        with:
          name: modpack-1.0.0
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Validate server package
        run: |
          set -euo pipefail
          test -f artifact/build/servidor.zip
          test -s artifact/build/servidor.zip
          unzip -t artifact/build/servidor.zip >/dev/null
          echo "servidor.zip is present and is a valid ZIP archive."
          ls -lh artifact/build/servidor.zip

      - name: Extract server package
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy
          unzip -q artifact/build/servidor.zip -d deploy
          test -n "$(find deploy -type f -print -quit)"
          echo "Prepared deployment payload:"
          find deploy -type f -printf '%P\n' | sort | head -200

      - name: Install OpenSSH password helper
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -V

      - name: Remove obsolete Voice Chat mod from deployment payload
        run: |
          set -euo pipefail
          find deploy -type f -iname 'voicechat-*.jar' -print -delete || true
          echo "Voice Chat jars present in deployment payload after cleanup:"
          find deploy -type f -iname 'voicechat-*.jar' -print

      - name: Upload server files via OpenSSH SFTP
        env:
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -euo pipefail

          cd deploy

          sshpass -e sftp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -P "$SFTP_PORT" \
            "$SFTP_USER@$SFTP_HOST" <<EOF
          cd "$SFTP_REMOTE_PATH"
          rm mods/voicechat-*.jar
          put -r *
          EOF

          echo "SFTP upload completed successfully."

      - name: Deployment summary
        run: |
          echo "SFTP upload completed."
          echo "Remote path: configured through GitHub Secret SFTP_REMOTE_PATH"
          echo "Voice Chat was removed from the deployment payload and any matching remote mods/voicechat-*.jar was deleted."
