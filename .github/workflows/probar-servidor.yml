name: Probar servidor

# Boot-test en runner limpio: reconstruye servidor.zip desde el lockfile
# congelado (los mismos 68 .jar, verificados por sha512), instala Fabric
# 1.21.1 + loader fijado, arranca con -Xmx4G, espera a "Done", analiza el log,
# detiene limpio e informa. No despliega, no toca versiones, no añade mods.
on:
  workflow_dispatch: {}
  push:
    branches:
      - "arena/**"
    paths:
      - ".github/workflows/probar-servidor.yml"
      - "scripts/probar_servidor.py"

permissions:
  contents: write

concurrency:
  group: probar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      INSTALLER_VERSION: "1.1.2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install script dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      - name: Reconstruir servidor.zip desde lockfile
        run: |
          test -f modpack/resolucion.json || (echo "::error::sin lockfile" && exit 1)
          python3 scripts/construir.py --resolucion modpack/resolucion.json --salida build/

      - name: Instalar Fabric (entorno limpio)
        run: |
          LOADER=$(python3 -c "import json;print(json.load(open('modpack/resolucion.json'))['fabric_loader'])")
          MC=$(python3 -c "import json;print(json.load(open('modpack/resolucion.json'))['minecraft'])")
          mkdir -p prueba/servidor
          cd prueba/servidor
          unzip -q -o ../../build/servidor.zip
          curl -fsSL -o /tmp/fabric-installer.jar "https://maven.fabricmc.net/net/fabricmc/fabric-installer/${INSTALLER_VERSION}/fabric-installer-${INSTALLER_VERSION}.jar"
          java -jar /tmp/fabric-installer.jar server -mcversion "$MC" -loader "$LOADER" -downloadMinecraft
          echo "eula=true" > eula.txt
          echo "Instalado: MC $MC + loader $LOADER (installer $INSTALLER_VERSION)"

      - name: Arrancar y analizar
        id: arranque
        run: python3 scripts/probar_servidor.py --dir prueba/servidor --resolucion modpack/resolucion.json --informe docs/INFORME_ARRANQUE.md --installer "$INSTALLER_VERSION"

      - name: Publicar informe
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/INFORME_ARRANQUE.md
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "[skip ci] Informe de arranque local (boot-test)" \
              -m "Prueba en runner limpio: Java 21, -Xmx4G, 68 mods de servidor."
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Subir log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-servidor-1.0.0
          retention-days: 90
          path: |
            prueba/arranque.log
            docs/INFORME_ARRANQUE.md
